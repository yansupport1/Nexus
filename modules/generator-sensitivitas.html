<!-- Nexus-X v3.3 module: Generator Sensitivitas FF -->
<section id="module_sensitivitas_ff" data-max-value="200" data-max-items="6">
  <h2>Generator Sensitivitas FF</h2>
  <p>Hasil ditampilkan sebagai barisan 6 nilai, masing-masing 1 sampai 200.</p>
  <input id="module_sensi_seed" type="number" min="1" max="200" placeholder="Nilai dasar">
  <div id="module_sensi_rows"></div>
  <button type="button" onclick="NexusModules.sensitivity.generate()">Generate</button>
  <button type="button" onclick="NexusModules.sensitivity.copy()">Copy Semua</button>
</section>
