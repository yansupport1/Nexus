<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nexus-X Market Prediction</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="market-service.js"></script><style>
:root{--bg:#060914;--panel:#0e1627;--panel2:#121e33;--line:#203451;--text:#eef5ff;--muted:#8595af;--cyan:#00eaff;--blue:#4d8dff;--purple:#9d7bff;--green:#32d583;--red:#ff5d77;--amber:#ffd166}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)!important;color:var(--text);font-family:Inter,system-ui,sans-serif}body{padding:12px 0 28px}.wrap{max-width:800px;margin:auto;padding:0 2px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:900}.title{font-size:25px;font-weight:950;margin:5px 0}.sub{color:var(--muted);font-size:10px;line-height:1.5}.btn{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--cyan);cursor:pointer}.btn:active{transform:scale(.94)}.notice{padding:11px 12px;margin-bottom:12px;border:1px solid rgba(255,209,102,.35);background:rgba(255,209,102,.08);border-radius:13px;color:#ffe5a2;font-size:10px;line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.metric,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(22,35,59,.94),rgba(8,14,26,.94));box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04)}.metric{padding:11px}.metric small{color:var(--muted);font-size:9px}.metric b{display:block;margin-top:4px;font-size:13px}.search{position:relative;margin-bottom:9px}.search i{position:absolute;left:12px;top:12px;color:var(--muted)}.search input{width:100%;height:38px;padding:0 12px 0 33px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:10px;font-weight:800}.tab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,234,255,.1)}.list{display:grid;gap:8px}.coin{display:grid;grid-template-columns:32px 1fr auto auto;gap:9px;align-items:center;padding:12px;border:1px solid rgba(32,52,81,.9);border-radius:14px;background:rgba(14,22,39,.9);cursor:pointer;transition:.16s}.coin:active{transform:scale(.985)}.coin img{width:30px;height:30px;border-radius:50%}.coin b{display:block;font-size:12px}.coin small{color:var(--muted);font-size:9px}.price{text-align:right;font-size:11px;font-weight:900}.chg{text-align:right;font-size:10px;font-weight:900;min-width:52px}.up{color:var(--green)}.down{color:var(--red)}.empty,.error{padding:26px 14px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:11px}.error{color:#ff9cad}.skeleton{height:57px;border-radius:14px;background:linear-gradient(90deg,#0d1627,#182a45,#0d1627);background-size:240% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-240% 0}}.detail{display:none;margin-top:12px;padding:15px}.detail.show{display:block}.detail_head{display:flex;align-items:center;gap:10px}.detail_head img{width:40px;height:40px;border-radius:50%}.detail_head h2{margin:0;font-size:17px}.detail_head small{color:var(--muted)}.close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:18px}.big{font-size:25px;font-weight:950;margin:15px 0 3px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.cell{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.13)}.cell small{color:var(--muted);font-size:9px}.cell b{display:block;margin-top:4px;font-size:11px}.forecast{padding:12px;border:1px solid rgba(157,123,255,.35);border-radius:13px;background:linear-gradient(135deg,rgba(157,123,255,.12),rgba(0,234,255,.05));margin-top:10px}.forecast h3{margin:0 0 5px;font-size:12px;color:#d8c9ff}.forecast p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}.chart{height:170px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:7px;background:#090f1d}.chart canvas{width:100%;height:100%}.time{display:flex;gap:6px;margin-top:9px}.time button{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:9px}.time button.active{border-color:var(--cyan);color:var(--cyan)}@media(max-width:460px){.coin{grid-template-columns:29px 1fr auto}.chg{display:none}.title{font-size:23px}.metric{padding:9px 7px}.metric b{font-size:11px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow"><i class="fa-solid fa-chart-line"></i> MARKET PREDICTION</div><div class="title" id="page_title">Market Outlook</div><div class="sub">Prediksi edukatif berbasis data publik · bukan harga live dan bukan nasihat finansial.</div></div><button class="btn" id="refresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button></header><div class="notice"><i class="fa-solid fa-circle-info"></i> Data ticker publik dipakai sebagai input analisis. Tidak ada transaksi, saldo, atau harga yang dimanipulasi.</div><section class="metrics"><div class="metric"><small>Aset dianalisis</small><b id="count">—</b></div><div class="metric"><small>Bias pasar</small><b id="bias">—</b></div><div class="metric"><small>Pembaruan</small><b id="updated">—</b></div></section><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Cari BTC, Bitcoin..." autocomplete="off"></label><div class="tabs"><button class="tab active" data-f="all">All</button><button class="tab" data-f="gainers">Momentum naik</button><button class="tab" data-f="losers">Momentum turun</button><button class="tab" data-f="watch">Watchlist</button></div><section id="list" class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section><section id="detail" class="card detail"></section></main><script>
(function(){'use strict';var data=[],f='all',q='',watch=JSON.parse(localStorage.getItem('nx_pred_watch')||'[]');function $(x){return document.getElementById(x)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function val(c){return c.quotes&&c.quotes.USD||{}}function usd(n){if(n==null||isNaN(n))return'—';n=Number(n);if(n>1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>1e6)return'$'+(n/1e6).toFixed(2)+'M';return'$'+n.toLocaleString('en-US',{maximumFractionDigits:n<1?8:2})}function pc(n){return n==null||isNaN(n)?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%'}function cls(n){return Number(n)>=0?'up':'down'}function norm(c){var v=val(c);return{id:c.id,name:c.name||c.id,symbol:(c.symbol||'').toUpperCase(),logo:c.logo||'',price:v.price,change:v.percent_change_24h,cap:v.market_cap,vol:v.volume_24h,high:v.high_24h,low:v.low_24h,rank:c.rank}}function render(){var a=data.slice();if(f==='gainers')a.sort(function(x,y){return(val(y).percent_change_24h||-999)-(val(x).percent_change_24h||-999)});if(f==='losers')a.sort(function(x,y){return(val(x).percent_change_24h||999)-(val(y).percent_change_24h||999)});if(f==='watch')a=a.filter(function(x){return watch.indexOf(x.id)>=0});if(q)a=a.filter(function(x){return(x.name+' '+x.symbol).toLowerCase().indexOf(q.toLowerCase())>=0});if(!a.length){$('list').innerHTML='<div class="empty">Tidak ada aset untuk filter ini.</div>';return}$('list').innerHTML=a.slice(0,80).map(function(c){var d=norm(c);return'<article class="coin" data-id="'+esc(d.id)+'"><img src="'+esc(d.logo)+'" alt=""><div><b>'+esc(d.name)+'</b><small>'+esc(d.symbol)+(d.rank?' · #'+d.rank:'')+'</small></div><div class="price">'+usd(d.price)+'</div><div class="chg '+cls(d.change)+'">'+pc(d.change)+'</div></article>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.coin'),function(x){x.onclick=function(){detail(x.dataset.id)}})}function detail(id){var raw=data.find(function(x){return x.id===id});if(!raw)return;var d=norm(raw),box=$('detail');box.innerHTML='<div class="detail_head"><img src="'+esc(d.logo)+'"><div><h2>'+esc(d.name)+'</h2><small>'+esc(d.symbol)+'</small></div><button class="close" id="close"><i class="fa-solid fa-xmark"></i></button></div><div class="big">'+usd(d.price)+'</div><div class="'+cls(d.change)+'">'+pc(d.change)+' 24H</div><div class="grid"><div class="cell"><small>Market Cap</small><b>'+usd(d.cap)+'</b></div><div class="cell"><small>Volume 24H</small><b>'+usd(d.vol)+'</b></div><div class="cell"><small>High 24H</small><b>'+usd(d.high)+'</b></div><div class="cell"><small>Low 24H</small><b>'+usd(d.low)+'</b></div></div><div class="forecast"><h3><i class="fa-solid fa-wand-magic-sparkles"></i> Prediksi edukatif</h3><p>'+prediction(d.change,d.high,d.low)+'</p></div><div class="time"><button class="active" data-days="1">1H</button><button data-days="1">1D</button><button data-days="7">1W</button><button data-days="30">1M</button><button data-days="365">1Y</button></div><div class="chart"><canvas id="cv"></canvas></div><p id="state" class="sub">Chart publik memuat…</p>';box.classList.add('show');$('close').onclick=function(){box.classList.remove('show')};Array.prototype.forEach.call(box.querySelectorAll('.time button'),function(b){b.onclick=function(){box.querySelectorAll('.time button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');chart(id,Number(b.dataset.days))}});chart(id,1);box.scrollIntoView({behavior:'smooth',block:'start'})}function prediction(ch,hi,lo){if(ch==null)return'Belum cukup data untuk membuat prediksi.';var direction=Number(ch)>0?'momentum positif':'momentum negatif';var range=(hi&&lo)?'Rentang 24H '+usd(lo)+' sampai '+usd(hi)+'. ':'';return direction+' berdasarkan perubahan 24H ('+pc(ch)+'). '+range+'Ini estimasi edukatif berbasis momentum sederhana, bukan jaminan harga masa depan.'}function chart(id,days){var st=$('state');if(st)st.textContent='Mengambil data historis…';NexusMarketService.chart(id,days).then(function(rows){var cv=$('cv');if(!cv)return;var z=rows.map(function(x){return Number(x.close)}).filter(isFinite);if(z.length<2){st.textContent='Data historis belum tersedia dari API.';return}var w=cv.clientWidth||320,h=cv.clientHeight||160,dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;var c=cv.getContext('2d');c.scale(dpr,dpr);var mi=Math.min.apply(Math,z),ma=Math.max.apply(Math,z),ra=ma-mi||1;c.beginPath();z.forEach(function(v,i){var x=i/(z.length-1)*w,y=h-((v-mi)/ra)*(h-14)-7;i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle='#00eaff';c.lineWidth=2;c.shadowColor='#00eaff';c.shadowBlur=7;c.stroke();c.shadowBlur=0;st.textContent='Sumber: CoinPaprika · '+z.length+' titik data'})['catch'](function(e){if(st)st.textContent='Chart tidak tersedia: '+e.message})}function load(){var l=$('list');l.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';NexusMarketService.markets().then(function(x){data=x||[];$('count').textContent=data.length;$('bias').textContent=(data.slice(0,20).reduce(function(s,c){return s+Number(val(c).percent_change_24h||0)},0)>=0?'Positif':'Negatif');$('updated').textContent=new Date().toLocaleTimeString('id-ID');render()})['catch'](function(e){l.innerHTML='<div class="error"><i class="fa-solid fa-triangle-exclamation"></i><br>Data prediksi gagal dimuat.<br><small>'+esc(e.message)+'</small><br><button class="tab" id="retry">Coba lagi</button></div>';var r=$('retry');if(r)r.onclick=load})}Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');f=t.dataset.f;render()}});$('q').oninput=function(){q=this.value;render()};$('refresh').onclick=load;window.addEventListener('message',function(e){if(e.data&&e.data.type==='nexus_market_tab')$('page_title').textContent=e.data.tab==='market'?'Market Outlook':(e.data.tab||'Market').replace(/^./,function(x){return x.toUpperCase()})});load();setInterval(load,30000)})();
</script></body></html>
